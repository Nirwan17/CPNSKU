name: Buat Keystore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek syarat
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          if [ -f keystore/cpnsku.jks ]; then
            echo "Keystore sudah ada. Tidak dibuat ulang supaya update tetap bisa dipasang."
            exit 1
          fi
          if [ -z "$KS_PASSWORD" ]; then
            echo "Secret KS_PASSWORD belum dibuat."
            exit 1
          fi

      - name: Buat keystore
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
        run: |
          mkdir -p keystore
          keytool -genkeypair -storetype PKCS12 \
            -keystore keystore/cpnsku.jks -alias cpnsku \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$KS_PASSWORD" -keypass "$KS_PASSWORD" \
            -dname "CN=CPNSku, O=Pribadi, C=ID"

      - name: Simpan keystore ke repositori
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add keystore/cpnsku.jks
          git commit -m "Tambah keystore"
          git push

      - name: Siapkan cadangan untuk diunduh
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup
          path: keystore/cpnsku.jks
